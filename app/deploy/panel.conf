# sing-box 面板配置（修改后重启面板生效；命令行参数优先于本文件）
#
# 监听地址：127.0.0.1:9090 仅本机可访问；改成 0.0.0.0:9090 后局域网设备也能打开面板
listen=127.0.0.1:9090

# 登录用户名 / 密码。
# - 首次启动打开面板网页时会要求设置登录账户密码（用户名默认用这里的 username）；
# - password 填上则跳过网页初始化，直接以该账户密码生效（适合自动化部署）；
# - 面板已经初始化过时，只填 username 不填 password 不会改动现有密码；
# - 关闭登录请用面板内「设置 → 允许免密码访问」开关，本文件不再承担。
username=admin
password=

# 此文件是明文，注意保管
#
# 内核（sing-box / mihomo）不在这里配置：
# - 面板「设置 → 内核」里切换后，选择会存进数据目录的 settings.json，重启后保持；
# - 想在启动时强制指定，用命令行参数 -engine mihomo（优先级高于 settings.json）；
# - 内核二进制路径用 -sing-box / -mihomo 指定，默认找 /usr/local/bin 下的同名文件。
# - Clash API（面板读连接、延迟、切节点用）默认监听 127.0.0.1:9091，用 -clash 改。
