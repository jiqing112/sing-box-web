# sing-box 面板配置（修改后重启面板生效；命令行参数优先于本文件）
#
# 监听地址：127.0.0.1:9090 仅本机可访问；改成 0.0.0.0:9090 后局域网设备也能打开面板
listen=127.0.0.1:9090

# 登录用户名 / 密码。
# - password 留空 = 保持现有密码不变；首次启动会自动生成随机密码，
#   并写入数据目录下的 initial-password 文件（登录后请改掉并删除该文件）。
# - 两项都留空（username= 和 password= 都不填）= 关闭登录，打开端口直接进首页。
# - 改用户名必须同时填写 password，否则本次修改会被忽略。
username=admin
password=

# 此文件是明文，注意保管
